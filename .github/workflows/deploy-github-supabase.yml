name: Deploy GitHub Pages and Supabase

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  # Chặn deploy khi edge function sai kiểu hoặc logic ghép trận hỏng.
  # Deploy bằng --use-api KHÔNG typecheck, nên bước này là lưới an toàn duy nhất.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck edge function
        run: |
          deno check --node-modules-dir=none supabase/functions/game-api/index.ts
          deno check --node-modules-dir=none supabase/functions/_shared/swiss.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test logic ghép trận
        run: node --experimental-strip-types server/test_matchmaking.mjs
      - name: Test ghép cặp Thụy Sĩ
        run: node --experimental-strip-types server/test_swiss.mjs

  deploy-supabase:
    needs: [check]
    if: ${{ vars.SUPABASE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply database migrations
        run: supabase db push --project-ref "$SUPABASE_PROJECT_ID" --yes
      - name: Deploy authenticated game API
        run: supabase functions deploy game-api --project-ref "$SUPABASE_PROJECT_ID" --use-api

  build-pages:
    needs: [check]
    if: ${{ vars.VITE_SUPABASE_URL != '' && vars.VITE_SUPABASE_PUBLISHABLE_KEY != '' }}
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /caro-tournament/
      VITE_GAME_BACKEND: supabase
      VITE_PUBLIC_SITE_URL: https://vuongndlst.github.io/caro-tournament/
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - run: npm run build --prefix client
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy-pages:
    needs: [build-pages]
    if: ${{ needs.build-pages.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
